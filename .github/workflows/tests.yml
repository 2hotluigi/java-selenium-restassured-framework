name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday at 12:00 UTC, to catch changes in the application under test.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression, e.g. "@smoke" or "@api and not @ui"'
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          if [ -n "$TAGS" ]; then
            mvn -B test -Dheadless=true "-Dcucumber.filter.tags=$TAGS"
          else
            mvn -B test -Dheadless=true
          fi

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Upload report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  publish-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
