name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday at 12:00 UTC, to catch changes in the application under test.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      tags:
        description: 'Extra Cucumber tag expression, e.g. "@smoke" or "not @regression"'
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # API scenarios do not open a browser, so they run once. UI scenarios run on every browser.
  test:
    name: ${{ matrix.suite }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: API, tags: "@api", browser: chrome }
          - { suite: UI, tags: "@ui", browser: chrome }
          - { suite: UI, tags: "@ui", browser: firefox }
          - { suite: UI, tags: "@ui", browser: edge }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        env:
          SUITE_TAGS: ${{ matrix.tags }}
          EXTRA_TAGS: ${{ github.event.inputs.tags }}
        run: |
          TAGS="$SUITE_TAGS"
          if [ -n "$EXTRA_TAGS" ]; then
            TAGS="$SUITE_TAGS and ($EXTRA_TAGS)"
          fi
          ./mvnw -B test -Dheadless=true -Dbrowser=${{ matrix.browser }} "-Dcucumber.filter.tags=$TAGS"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}-${{ matrix.browser }}
          path: target/allure-results
          retention-days: 7

  # Merges the results of every job into a single Allure report.
  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: results

      # Every job writes its own environment.properties. Merge them so each key lists
      # all its values (for example "Browser = chrome, firefox, edge").
      - name: Merge Allure results
        run: |
          mkdir -p target/allure-results
          cp -r results/*/. target/allure-results/
          awk '/^#/ || !NF { next }
            {
              key = substr($0, 1, index($0, "=") - 1); value = substr($0, index($0, "=") + 1)
              if ((key, value) in seen) next
              seen[key, value] = 1
              if (!(key in values)) order[++count] = key
              values[key] = (key in values) ? values[key] ", " value : value
            }
            END { for (i = 1; i <= count; i++) print order[i] "=" values[order[i]] }' \
            results/*/environment.properties > target/allure-results/environment.properties

      # Copy the history of the report published on GitHub Pages into the new results,
      # so the Trend charts show previous runs. The first run simply has no history.
      - name: Restore Allure history
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p target/allure-results/history
          for file in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            if curl -fsSL "$REPORT_URL/history/$file" -o "/tmp/$file"; then
              mv "/tmp/$file" "target/allure-results/history/$file"
            fi
          done

      - name: Generate Allure report
        run: ./mvnw -B allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Upload report for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  publish-report:
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
